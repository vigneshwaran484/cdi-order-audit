[project]
name = "cdi-order-audit"
version = "0.1.0"
description = "Order-to-audit system for a small food manufacturer"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "openpyxl>=3.1.5",
    "fpdf2>=2.9.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.34",
    "itsdangerous>=2.2.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
