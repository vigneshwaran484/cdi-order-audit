services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cdi
      POSTGRES_PASSWORD: cdi
      POSTGRES_DB: cdi
    ports:
      - "5433:5432"   # 5433 on the host so it doesn't clash with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cdi"]
      interval: 3s
      retries: 10

  app:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://cdi:cdi@db:5432/cdi
      SESSION_SECRET: ${SESSION_SECRET:-change-me-for-a-real-deployment}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
